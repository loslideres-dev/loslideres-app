<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo-mini.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light only" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Los Líderes Encomiendas</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        transition: opacity 0.4s ease;
      }
      #splash img {
        width: 260px;
        height: auto;
        display: block;
        animation: splash-pop 0.5s ease;
      }
      #splash p {
        color: #64748b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        margin: 0;
      }
      #splash .dot-loader {
        display: flex; gap: 6px;
      }
      #splash .dot-loader span {
        width: 9px; height: 9px; border-radius: 50%;
        background: #1565C0;
        animation: splash-bounce 1.2s infinite ease-in-out;
      }
      #splash .dot-loader span:nth-child(2) { animation-delay: 0.15s }
      #splash .dot-loader span:nth-child(3) { animation-delay: 0.3s }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4 }
        40% { transform: scale(1); opacity: 1 }
      }
      @keyframes splash-pop {
        from { transform: scale(0.92); opacity: 0 }
        to   { transform: scale(1);    opacity: 1 }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo-full.png" alt="Los Líderes Encomiendas" />
      <p>De Maicao a tu puerta en Maracaibo</p>
      <div class="dot-loader"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
